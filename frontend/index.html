<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=edit,delete">

    <title>Lista de Tarefas</title>
</head>
<body>
    <main>
        <form class="add-form">
            <input type="text" class="input-task" placeholder="Digite uma tarefa" required>
            <button type="submit" aria-label="Adicionar tarefa">+</button>
        </form>

        <p class="feedback" role="status" aria-live="polite"></p>

        <table>
            <thead>
                <tr>
                    <th>Tarefa</th>
                    <th>Criada em</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
